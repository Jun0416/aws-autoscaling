name: Docker Build and Push
on: 
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/docker.yml"]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
                junyong0416/flask-app:latest
                junyong0416/flask-app:${{ github.sha }}


  deploy:
    needs: build            # job 1 이름과 같아야 해요
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890988596463:role/github-actions-terraform-role
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: terraform
      - run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"
        working-directory: terraform